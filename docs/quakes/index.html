<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#07090c">
<title>Arrival Times · station</title>
<link rel="stylesheet" href="phone.css">
</head>
<body>
<!-- Before joining -->
<main id="join">
  <div class="kicker">ARRIVAL TIMES</div>
  <h1>Your phone becomes a seismic station somewhere on Earth.</h1>
  <button id="joinBtn" type="button">Join</button>
  <ul class="hints">
    <li>Volume up. On an iPhone, switch the silent mode off.</li>
    <li>Keep this page open and put the phone on the table.</li>
    <li>No Bluetooth speakers or headphones.</li>
  </ul>
  <div class="room" id="roomTxt"></div>
</main>

<!-- After joining -->
<main id="station" hidden>
  <div class="kicker"><span id="status" class="dot"></span>STATION <span id="code"></span></div>
  <h1 id="name"></h1>
  <div class="region" id="region"></div>
  <canvas id="map" aria-label="Where this station is"></canvas>
  <div class="arrival" id="arrival">listening to the ground…</div>
  <canvas id="trace" aria-label="The ground at this station, live"></canvas>
  <div class="ground" id="groundTxt"></div>
  <label class="vol">volume <input id="vol" type="range" min="0" max="1" step="0.01" value="0.9"></label>
</main>
<div id="flash"></div>
<script type="module" src="phone.js?v=9"></script>
</body>
</html>
